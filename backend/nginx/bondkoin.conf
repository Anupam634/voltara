server {
    listen 80;
    listen [::]:80;
    server_name api.bondkoinlabs.com _;

    # Matches the 10mb body limit Express is configured with in src/main.ts.
    # A larger ceiling here only means a big upload is streamed all the way to
    # Node before Node rejects it.
    client_max_body_size 10M;

    location / {
        # CORS is deliberately NOT handled here.
        #
        # This block used to add `Access-Control-Allow-Origin $http_origin`
        # with credentials enabled, and answer preflights itself. That
        # reflects *any* origin, so the allowlist in src/common/cors-origins.ts
        # was dead code: every page on the internet could call this API from a
        # victim's browser. The app is now the single source of truth — it
        # sets the header only for origins on its list, and answers its own
        # OPTIONS. Do not re-add `add_header Access-Control-*` here: two
        # Access-Control-Allow-Origin headers on one response is a hard CORS
        # failure in every browser.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
