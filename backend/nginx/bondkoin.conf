server {
    listen 80;
    listen [::]:80;
    server_name api.bondkoinlabs.com _;

    client_max_body_size 50M;

    # NestJS sets these too. Hide the upstream copy so a response never carries
    # two Access-Control-Allow-Origin headers (browsers reject duplicates), then
    # re-add them here with `always` — which also puts them on nginx's own error
    # pages. Without this, a dead upstream reaches the browser as "No
    # 'Access-Control-Allow-Origin' header" and hides the real 502.
    # An empty $http_origin emits no header at all, so same-origin calls are
    # unaffected.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;

    location / {
        # Handle CORS preflight OPTIONS requests directly in Nginx
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'Origin,X-Requested-With,Content-Type,Accept,Authorization,X-CSRF-Token,Fingerprint,Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
