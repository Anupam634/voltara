# Render Blueprint — the deployment config lives here rather than only in the
# dashboard, so it cannot silently drift. Render reads this on "New → Blueprint";
# an existing service keeps whatever its dashboard settings say, so check them
# against this file after adopting it.
#
# Migrations and catalogue seeding run from `npm run start:prod` (see
# backend/package.json), not from this file, so they happen on every deploy
# whatever the start command is set to here.
services:
  - type: web
    name: voltara-api
    runtime: node
    rootDir: backend
    # NOT free: the free plan sleeps on inactivity, and a sleeping instance
    # runs no cron. This API has ten scheduled jobs — seasons pay on Monday
    # 00:10, the blueprint challenge on 00:05, the daily puzzle at midnight,
    # duels settle every 5 minutes. On free they simply never fire, and
    # nothing looks broken because a health check wakes the box up.
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voltara-db
          property: connectionString
      # Secrets are deliberately not committed. `sync: false` makes Render
      # prompt for them at deploy time instead of expecting a value here.
      - key: JWT_SECRET
        sync: false
      # The first admin panel login, created at boot. Without these a fresh
      # deployment has no way into its own admin panel: there is no admin
      # self-signup and the free tier has no shell to run the CLI from.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HOT_WALLET_PRIVATE_KEY
        sync: false
      # Signup REQUIRES a 6-digit email code, so without working SMTP nobody
      # can create an account at all — `send-otp` answers 502 and the form
      # dead-ends. The transporter is only built when BOTH a user and a
      # password are present, so an unset SMTP_PASS silently disables email
      # rather than failing at boot. These were missing entirely, which made
      # a fresh deploy look healthy while being impossible to sign up to.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Booster payments stay disabled until these two are set — see DEPLOY.md.
      - key: BOOSTER_PAY_TO_ADDRESS
        sync: false
      - key: BOOSTER_PAY_TOKEN_ADDRESS
        sync: false
      # KYC follows the payout window unless set. Left unset on purpose:
      # documents are not collected until there is a payout to verify for.
      - key: KYC_OPEN
        sync: false
      # The payout kill switch, explicit rather than relying on the code's
      # closed-by-default. Flip to "true" on launch day.
      - key: PAYOUTS_OPEN
        value: "false"
      # Links inside outgoing email are built from this.
      - key: WEB_URL
        value: https://voltaragrid.com
      - key: CORS_ORIGINS
        value: https://voltaragrid.com,https://www.voltaragrid.com
      - key: WALLET_MODE
        value: offchain
      - key: BSC_RPC_URL
        value: https://bsc-dataseed.binance.org/
      - key: BOOSTER_PAY_TOKEN
        value: USDT
      - key: BOOSTER_PAY_TOKEN_DECIMALS
        value: "18"
      - key: BOOSTER_MIN_CONFIRMATIONS
        value: "6"

databases:
  - name: voltara-db
    region: oregon
    # Render's free Postgres is DELETED after 30 days. Fine while testing,
    # fatal once there are real miners — every balance and every ledger row
    # goes with it. Move to a paid plan before anyone signs up.
    plan: free

envVarGroups: []
