name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.BACKEND_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: ENV_CONTENT
          script: |
            set -e
            echo "⚡ Starting automated deployment on AWS EC2..."
            
            # Ensure base directories and permissions exist
            sudo mkdir -p /var/www
            sudo chown -R $USER:$USER /var/www
            
            # Ensure swap memory exists for smooth builds
            if [ ! -f /swapfile ]; then
              echo "⚙️ Creating 2GB Swap Memory..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab || true
            fi
            
            # Ensure Node.js, Git, and PM2 are installed
            if ! command -v pm2 &> /dev/null; then
              echo "⚙️ Installing Git, Node.js & PM2..."
              if command -v dnf &> /dev/null; then
                sudo dnf install -y git nodejs npm
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y git nodejs npm
              fi
              sudo npm install -g pm2
            fi
            
            # Ensure PATH includes npm global binaries
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(node -v 2>/dev/null)/bin:$(npm root -g 2>/dev/null)/../bin
            
            # Clone repo if not exists, or pull latest changes
            if [ ! -d "/var/www/bondkoin/.git" ]; then
              echo "📥 Cloning repository for the first time..."
              git clone https://github.com/Anupam634/Matsumoto.git /var/www/bondkoin
            else
              echo "📥 Pulling latest commits from origin main..."
              cd /var/www/bondkoin
              git reset --hard origin/main
              git pull origin main
            fi
            
            cd /var/www/bondkoin/backend
            
            # Auto-write .env file from GitHub Secret (if ENV_CONTENT secret is set)
            if [ -n "$ENV_CONTENT" ]; then
              echo "🔐 Writing .env file from GitHub Secrets..."
              printf "%s\n" "$ENV_CONTENT" > .env
              chmod 600 .env
            fi
            
            # Install npm dependencies
            echo "📦 Installing npm dependencies..."
            npm install
            
            # Generate Prisma database client
            echo "🗄️ Generating Prisma client..."
            npx prisma generate
            
            # Sync database schema
            echo "🔄 Applying database schema migrations..."
            npx prisma db push --accept-data-loss
            
            # Build NestJS production bundle
            echo "🔨 Building NestJS application..."
            npm run build
            
            # Reload PM2 with updated environment variables
            echo "🚀 Reloading PM2 process with fresh environment variables..."
            pm2 restart bondkoin-backend --update-env || pm2 start dist/main.js --name "bondkoin-backend" --update-env
            pm2 save
            
            # Automated Nginx & Domain Reverse Proxy Setup
            echo "🌐 Configuring automated Nginx Reverse Proxy for api.bondkoinlabs.com..."
            if ! command -v nginx &> /dev/null; then
              if command -v dnf &> /dev/null; then
                sudo dnf install -y nginx
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y nginx
              fi
            fi
            
            # Install Certbot for free automatic HTTPS SSL
            if ! command -v certbot &> /dev/null; then
              echo "🔒 Installing Certbot for automatic SSL..."
              if command -v dnf &> /dev/null; then
                sudo dnf install -y python3-pip || true
                sudo python3 -m pip install --upgrade pip || true
                sudo python3 -m pip install certbot certbot-nginx || true
                sudo ln -s /usr/local/bin/certbot /usr/bin/certbot 2>/dev/null || true
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y certbot python3-certbot-nginx || true
              fi
            fi
            
            sudo mkdir -p /etc/nginx/conf.d
            printf 'server {\n    listen 80;\n    listen [::]:80;\n    server_name api.bondkoinlabs.com _;\n\n    client_max_body_size 50M;\n\n    location / {\n        proxy_pass http://127.0.0.1:3001;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection "upgrade";\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_cache_bypass $http_upgrade;\n    }\n}\n' | sudo tee /etc/nginx/conf.d/bondkoin.conf > /dev/null
            sudo systemctl enable nginx
            sudo systemctl restart nginx || sudo nginx -s reload
            
            # Auto-provision SSL certificate via Certbot if DNS is resolved
            if command -v certbot &> /dev/null; then
              echo "🔒 Checking & provisioning Let's Encrypt SSL certificate for api.bondkoinlabs.com..."
              sudo certbot --nginx -d api.bondkoinlabs.com --non-interactive --agree-tos -m hello@bondkoinlabs.com --redirect || echo "⚠️ Certbot notice: SSL will activate once DNS A-record is active."
            fi
            
            echo "✅ Deployment & Nginx domain configuration completed successfully!"
