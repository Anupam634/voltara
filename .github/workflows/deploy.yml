name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.BACKEND_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: ENV_CONTENT
          script: |
            set -e
            echo "⚡ Starting automated deployment on AWS EC2..."
            
            # Ensure base directories and permissions exist
            sudo mkdir -p /var/www
            sudo chown -R $USER:$USER /var/www
            
            # Ensure swap memory exists for smooth builds
            if [ ! -f /swapfile ]; then
              echo "⚙️ Creating 2GB Swap Memory..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab || true
            fi
            
            # Ensure Node.js, Git, and PM2 are installed
            if ! command -v pm2 &> /dev/null; then
              echo "⚙️ Installing Git, Node.js & PM2..."
              if command -v dnf &> /dev/null; then
                sudo dnf install -y git nodejs npm
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y git nodejs npm
              fi
              sudo npm install -g pm2
            fi
            
            # Ensure PATH includes npm global binaries
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(node -v 2>/dev/null)/bin:$(npm root -g 2>/dev/null)/../bin
            
            # Clone repo if not exists, or pull latest changes
            if [ ! -d "/var/www/bondkoin/.git" ]; then
              echo "📥 Cloning repository for the first time..."
              git clone https://github.com/Anupam634/Matsumoto.git /var/www/bondkoin
            else
              echo "📥 Pulling latest commits from origin main..."
              cd /var/www/bondkoin
              git reset --hard origin/main
              git pull origin main
            fi
            
            cd /var/www/bondkoin/backend
            
            # Auto-write .env file from GitHub Secret (if ENV_CONTENT secret is set)
            if [ -n "$ENV_CONTENT" ]; then
              echo "🔐 Writing .env file from GitHub Secrets..."
              printf "%s\n" "$ENV_CONTENT" > .env
              chmod 600 .env
            fi
            
            # Ensure PORT=3001 is set in .env
            sed -i '/^PORT=/d' .env 2>/dev/null || true
            echo "PORT=3001" >> .env
            
            # Install npm dependencies
            echo "📦 Installing npm dependencies..."
            npm install
            
            # Generate Prisma database client
            echo "🗄️ Generating Prisma client..."
            npx prisma generate
            
            # Sync database schema
            echo "🔄 Applying database schema migrations..."
            npx prisma db push --accept-data-loss
            
            # Build NestJS production bundle
            echo "🔨 Building NestJS application..."
            npm run build
            
            # Reload PM2 with clean start on Port 3001
            echo "🚀 Starting PM2 process on Port 3001..."
            pm2 delete all 2>/dev/null || true
            PORT=3001 pm2 start dist/main.js --name "bondkoin-backend" --update-env
            pm2 save

            # `pm2 save` only writes the process list to disk — on its own it does
            # nothing at boot. Without a systemd unit, an instance reboot brings
            # nginx back (it is systemctl-enabled) while PM2 stays down, and every
            # route 502s until someone SSHes in. `pm2 startup` installs that unit.
            echo "♻️ Installing PM2 systemd unit so the API survives reboots..."
            sudo env PATH=$PATH:$(dirname $(command -v node)) $(command -v pm2) startup systemd -u $USER --hp $HOME
            pm2 save

            echo "⏳ Waiting for NestJS to initialize..."
            pm2 list

            echo "🔍 Testing local backend health probe on Port 3001..."
            HEALTH_CODE=""
            for attempt in $(seq 1 15); do
              HEALTH_CODE=$(curl -s -o /tmp/health.out -w '%{http_code}' http://127.0.0.1:3001/api/health || true)
              if [ "$HEALTH_CODE" = "200" ]; then
                echo "✅ Backend healthy after ${attempt} attempt(s): $(cat /tmp/health.out)"
                break
              fi
              sleep 2
            done

            # Fail the deploy loudly. Previously this was `|| echo "⚠️ ..."`, so a
            # backend that never came up still reported a green deploy — the exact
            # state that surfaces in the browser as an unexplained CORS error.
            if [ "$HEALTH_CODE" != "200" ]; then
              echo "❌ Backend never became healthy (last status: ${HEALTH_CODE:-no response})."
              pm2 logs bondkoin-backend --lines 80 --nostream || true
              exit 1
            fi
            
            # Automated Nginx & Domain Reverse Proxy Setup
            echo "🌐 Configuring automated Nginx Reverse Proxy for api.bondkoinlabs.com..."
            if ! command -v nginx &> /dev/null; then
              if command -v dnf &> /dev/null; then
                sudo dnf install -y nginx
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y nginx
              fi
            fi
            
            # Install Certbot for free automatic HTTPS SSL
            if ! command -v certbot &> /dev/null; then
              echo "🔒 Installing Certbot for automatic SSL..."
              if command -v dnf &> /dev/null; then
                sudo dnf install -y python3-pip || true
                sudo python3 -m pip install --upgrade pip || true
                sudo python3 -m pip install certbot certbot-nginx || true
                sudo ln -s /usr/local/bin/certbot /usr/bin/certbot 2>/dev/null || true
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y certbot python3-certbot-nginx || true
              fi
            fi
            
            sudo mkdir -p /etc/nginx/conf.d
            sudo cp /var/www/bondkoin/backend/nginx/bondkoin.conf /etc/nginx/conf.d/bondkoin.conf
            sudo systemctl enable nginx
            sudo nginx -t && (sudo systemctl restart nginx || sudo nginx -s reload)
            
            # Auto-provision SSL certificate via Certbot if DNS is resolved
            if command -v certbot &> /dev/null; then
              echo "🔒 Checking & provisioning Let's Encrypt SSL certificate for api.bondkoinlabs.com..."
              sudo certbot --nginx -d api.bondkoinlabs.com --non-interactive --agree-tos -m hello@bondkoinlabs.com --redirect || echo "⚠️ Certbot notice: SSL will activate once DNS A-record is active."
            fi
            
            echo "🌐 Testing public HTTPS API endpoint..."
            curl -v https://api.bondkoinlabs.com/api/health || echo "⚠️ HTTPS probe returned non-200"
            
            echo "✅ Deployment & Nginx domain configuration completed successfully!"
