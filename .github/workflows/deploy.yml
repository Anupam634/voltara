name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.BACKEND_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: ENV_CONTENT
          script: |
            set -e
            echo "⚡ Starting automated deployment on AWS EC2..."
            
            # Ensure base directories and permissions exist
            sudo mkdir -p /var/www
            sudo chown -R $USER:$USER /var/www
            
            # Ensure swap memory exists for smooth builds
            if [ ! -f /swapfile ]; then
              echo "⚙️ Creating 2GB Swap Memory..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab || true
            fi
            
            # Ensure Node.js, Git, and PM2 are installed
            if ! command -v pm2 &> /dev/null; then
              echo "⚙️ Installing Git, Node.js & PM2..."
              if command -v dnf &> /dev/null; then
                sudo dnf install -y git nodejs npm
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y git nodejs npm
              fi
              sudo npm install -g pm2
            fi
            
            # Ensure PATH includes npm global binaries
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(node -v 2>/dev/null)/bin:$(npm root -g 2>/dev/null)/../bin
            
            # Clone repo if not exists, or pull latest changes
            if [ ! -d "/var/www/bondkoin/.git" ]; then
              echo "📥 Cloning repository for the first time..."
              git clone https://github.com/Anupam634/Matsumoto.git /var/www/bondkoin
            else
              echo "📥 Pulling latest commits from origin main..."
              cd /var/www/bondkoin
              git reset --hard origin/main
              git pull origin main
            fi
            
            cd /var/www/bondkoin/backend
            
            # Auto-write .env file from GitHub Secret (if ENV_CONTENT secret is set)
            if [ -n "$ENV_CONTENT" ]; then
              echo "🔐 Writing .env file from GitHub Secrets..."
              printf "%s\n" "$ENV_CONTENT" > .env
              chmod 600 .env
            fi
            
            # Install npm dependencies
            echo "📦 Installing npm dependencies..."
            npm install
            
            # Generate Prisma database client
            echo "🗄️ Generating Prisma client..."
            npx prisma generate
            
            # Sync database schema
            echo "🔄 Applying database schema migrations..."
            npx prisma db push --accept-data-loss
            
            # Build NestJS production bundle
            echo "🔨 Building NestJS application..."
            npm run build
            
            # Reload PM2 with zero downtime
            echo "🚀 Reloading PM2 process..."
            pm2 reload bondkoin-backend || pm2 start dist/main.js --name "bondkoin-backend"
            pm2 save
            
            # Automated Nginx Reverse Proxy Setup (Port 80 -> Port 3001)
            echo "🌐 Configuring automated Nginx Reverse Proxy..."
            if ! command -v nginx &> /dev/null; then
              if command -v dnf &> /dev/null; then
                sudo dnf install -y nginx
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y nginx
              fi
            fi
            
            sudo mkdir -p /etc/nginx/conf.d
            sudo tee /etc/nginx/conf.d/bondkoin.conf > /dev/null << 'EOF'
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
EOF
            sudo systemctl enable nginx
            sudo systemctl restart nginx || sudo nginx -s reload
            
            echo "✅ Deployment & Nginx Reverse Proxy completed successfully!"
