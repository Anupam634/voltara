<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Mountain background -->
  <defs>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#mountainGrad)" stroke="#daa520" stroke-width="2" opacity="0.9"/>

  <!-- Mountain peaks -->
  <path d="M 40 140 L 80 60 L 120 100 L 160 50 L 170 140 Z" fill="#1a1a1a" opacity="0.6"/>
  <path d="M 50 140 L 85 70 L 115 110 L 155 60 L 165 140 Z" fill="#2a2a2a" opacity="0.4"/>

  <!-- Mine cart body -->
  <g transform="translate(100, 105)">
    <!-- Cart base -->
    <rect x="-22" y="-8" width="44" height="16" rx="2" fill="url(#goldGrad)" stroke="#daa520" stroke-width="1.5"/>

    <!-- Cart sides -->
    <rect x="-25" y="-12" width="6" height="20" rx="1" fill="url(#goldGrad)" stroke="#daa520" stroke-width="1"/>
    <rect x="19" y="-12" width="6" height="20" rx="1" fill="url(#goldGrad)" stroke="#daa520" stroke-width="1"/>

    <!-- Cart details/bumpers -->
    <rect x="-28" y="6" width="56" height="2" fill="#daa520" opacity="0.7"/>

    <!-- Wheels -->
    <circle cx="-18" cy="14" r="5" fill="none" stroke="#daa520" stroke-width="2" opacity="0.9"/>
    <circle cx="-18" cy="14" r="3" fill="#0a0a0a"/>

    <circle cx="18" cy="14" r="5" fill="none" stroke="#daa520" stroke-width="2" opacity="0.9"/>
    <circle cx="18" cy="14" r="3" fill="#0a0a0a"/>

    <!-- Gold ore in cart (3 nuggets) -->
    <ellipse cx="-8" cy="-4" rx="4" ry="5" fill="#ffed4e" opacity="0.9"/>
    <ellipse cx="0" cy="-6" rx="5" ry="6" fill="url(#goldGrad)" opacity="0.95"/>
    <ellipse cx="8" cy="-4" rx="4" ry="5" fill="#ffed4e" opacity="0.9"/>

    <!-- Track rails (subtle) -->
    <line x1="-35" y1="18" x2="35" y2="18" stroke="#daa520" stroke-width="1" opacity="0.4"/>
    <line x1="-35" y1="20" x2="35" y2="20" stroke="#daa520" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Text: Matsumoto (optional for larger versions) -->
  <text x="100" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffd700" opacity="0.8">MATSUMOTO</text>
</svg>
